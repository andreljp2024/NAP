version: '3.8'

services:
  wacrm-web:
    build: .
    container_name: nap-wacrm
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgres://postgres:nap_secure_pwd@db:5432/nap_crm
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: nap-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nap_secure_pwd
      POSTGRES_DB: nap_crm
    ports:
      - "5432:5432"
    volumes:
      - nap_pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: nap-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - nap_redisdata:/data

volumes:
  nap_pgdata:
  nap_redisdata:
