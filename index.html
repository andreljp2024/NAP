<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suprime avisos benignos de websocket do Vite em ambientes com DISABLE_HMR ativo
      (function() {
        const isViteNotice = (arg) => typeof arg === 'string' && (arg.includes('[vite]') || arg.includes('failed to connect to websocket'));
        const _err = console.error;
        const _warn = console.warn;
        console.error = function(...args) {
          if (args.some(isViteNotice)) return;
          _err.apply(console, args);
        };
        console.warn = function(...args) {
          if (args.some(isViteNotice)) return;
          _warn.apply(console, args);
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAP - Núcleo de Atendimento ao Provedor</title>
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Portal NAP" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta name="description" content="Plataforma Omnichannel Premium com Inteligência Artificial para ISPs." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;

      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Outfit', sans-serif;
